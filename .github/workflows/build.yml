name: Build MosqueManager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "MosqueAppPassword123"
      KEY_PASSWORD: "MosqueAppPassword123"

    steps:
      # 1. جلب الملفات من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. فك ضغط ملف الـ ZIP وتجهيز البيئة وإصلاح إعدادات البناء تلقائياً
      - name: Extract ZIP & Auto-Fix Build Configs
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE ..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

          # إنشاء ملف .env
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=DUMMY_KEY" > .env
          fi

          # حذف ملف baseline-prof.txt اليدوي الذي يوقف بناء Release في النهاية
          rm -f app/src/main/baseline-prof.txt

          # ضبط gradle.properties لمنع نفاد الذاكرة أو فشل Configuration Cache
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          googleServices.missing.passthrough=true
          EOF

          # تعطيل R8 الخاطئ أثناء البناء السحابي لضمان عدم فشل التجميع النهائي
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts

      # 3. إعداد Java 21 المتوافق مع AGP 9.1.1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. الموافقة على تراخيص Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. توليد مفاتيح التوقيع الرقمي (Release & Debug)
      - name: Generate Signing Keystores
        run: |
          rm -f my-upload-key.jks debug.keystore
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MosqueManager, OU=App, O=Mosque, L=City, S=State, C=SY"

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US"

      # 6. تثبيت Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. بناء نسخة Release و Debug مع تخطي فحوصات Lint المعطِّلة
      - name: Build Signed APKs
        run: |
          gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      # 8. رفع ملفات الـ APK الجاهزة للتحميل (حتى لو نجحت إحداهما فقط)
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MosqueManager-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
