name: Build MosqueManager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "MosqueAppPassword123"
      KEY_PASSWORD: "MosqueAppPassword123"

    steps:
      # 1. جلب الملفات من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. فك ضغط ملف الـ ZIP تلقائياً (إذا تم رفعه مضغوطاً) وتجهيز ملف .env
      - name: Extract ZIP (if uploaded as zip) & Prepare .env
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP file: $ZIP_FILE - Extracting..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=DUMMY_KEY" > .env
            fi
          fi

      # 3. إعداد Java 17 المتوافق مع AGP 9.1.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. الموافقة على تراخيص Android SDK لتحميل API 36.1 تلقائياً
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. توليد مفاتيح التوقيع الرقمي التي يطلبها ملف app/build.gradle.kts
      - name: Generate Signing Keystores (Release & Debug)
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=MosqueManager, OU=App, O=Mosque, L=City, S=State, C=SY"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      # 6. تثبيت Gradle 9.3.1 المتوافق مع مشروعك (بديلاً عن gradlew غير الموجود)
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. بناء نسخة Release النهائية المصغّرة (R8) ونسخة Debug الاحتياطية
      - name: Build Signed APKs
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      # 8. رفع ملفات الـ APK الجاهزة للتحميل
      - name: Upload Release & Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MosqueManager-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
