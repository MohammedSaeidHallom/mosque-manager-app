name: Build MosqueManager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "MosqueAppPassword123"
      KEY_PASSWORD: "MosqueAppPassword123"

    steps:
      # 1. جلب الملفات من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. فك ضغط الـ ZIP وإصلاح نقص اللون Emerald300 في Color.kt تلقائياً
      - name: Extract ZIP & Fix Missing Color Reference
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

          # إنشاء ملف .env
          cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=DUMMY_KEY" > .env

          # إضافة اللون الناقص Emerald300 (ودرجة Emerald400 احتياطياً) إلى ملف Color.kt
          if ! grep -q "val Emerald300" app/src/main/java/com/example/ui/theme/Color.kt; then
            cat << 'EOF' >> app/src/main/java/com/example/ui/theme/Color.kt

          val Emerald400 = Color(0xFF34D399)
          val Emerald300 = Color(0xFF6EE7B7)
          EOF
          fi

          # حذف ملف baseline-prof.txt اليدوي لتجنب أخطاء التجميع
          rm -f app/src/main/baseline-prof.txt

          # ضبط إعدادات الذاكرة لـ Gradle
          printf "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\norg.gradle.caching=true\norg.gradle.configuration-cache=false\ngoogleServices.missing.passthrough=true\n" > gradle.properties

          # تعطيل R8 أثناء البناء السحابي لضمان سرعة واستقرار التجميع
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts

      # 3. إعداد Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. الموافقة على تراخيص Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. توليد مفاتيح التوقيع الرقمي (Release & Debug)
      - name: Generate Signing Keystores
        run: |
          rm -f my-upload-key.jks debug.keystore
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MosqueManager, OU=App, O=Mosque, L=City, S=State, C=SY"

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US"

      # 6. تثبيت Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. بناء الـ APK مع حفظ سجل البناء الكامل
      - name: Build Signed APKs
        run: |
          gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt

      # 8. رفع ملفات الـ APK الجاهزة للتحميل (مع سجل البناء)
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MosqueManager-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            build_log.txt
